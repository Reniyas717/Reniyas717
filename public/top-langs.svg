<svg width="300" height="165" viewBox="0 0 300 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; animation: fadeInAnimation 0.8s ease-in-out forwards; }
    .lang-name { font: 400 11px "Segoe UI", Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
    @keyframes fadeInAnimation { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#30363d" width="299" fill="#0d1117" stroke-opacity="1" />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header">My Programming Languages</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      <rect mask="url(#rect-mask)" x="0" y="0" width="93.17" height="8" fill="#DA5B0B" />
      <rect mask="url(#rect-mask)" x="93.17" y="0" width="81.76" height="8" fill="#3178c6" />
      <rect mask="url(#rect-mask)" x="174.93" y="0" width="61.72" height="8" fill="#f1e05a" />
      <rect mask="url(#rect-mask)" x="236.65" y="0" width="19.79" height="8" fill="#336790" />
      <rect mask="url(#rect-mask)" x="246.44" y="0" width="11.88" height="8" fill="#3572A5" />

      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          <g transform="translate(0, 0)" class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="6" r="5" fill="#DA5B0B" />
            <text x="15" y="10" class="lang-name">Jupyter Notebook 37.3%</text>
          </g>
          <g transform="translate(0, 22)" class="stagger" style="animation-delay: 600ms">
            <circle cx="5" cy="6" r="5" fill="#3178c6" />
            <text x="15" y="10" class="lang-name">TypeScript 32.7%</text>
          </g>
          <g transform="translate(0, 44)" class="stagger" style="animation-delay: 750ms">
            <circle cx="5" cy="6" r="5" fill="#f1e05a" />
            <text x="15" y="10" class="lang-name">JavaScript 24.7%</text>
          </g>
        </g>
        <g transform="translate(145, 0)">
          <g transform="translate(0, 0)" class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="6" r="5" fill="#336790" />
            <text x="15" y="10" class="lang-name">PLpgSQL 3.9%</text>
          </g>
          <g transform="translate(0, 22)" class="stagger" style="animation-delay: 600ms">
            <circle cx="5" cy="6" r="5" fill="#3572A5" />
            <text x="15" y="10" class="lang-name">Python 0.8%</text>
          </g>
          <g transform="translate(0, 44)" class="stagger" style="animation-delay: 750ms">
            <circle cx="5" cy="6" r="5" fill="#663399" />
            <text x="15" y="10" class="lang-name">CSS 0.7%</text>
          </g>
        </g>
      </g>
    </svg>
  </g>
</svg>
